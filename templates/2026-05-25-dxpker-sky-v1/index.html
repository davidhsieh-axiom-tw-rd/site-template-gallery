<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450,initial-scale=1,maximum-scale=1,user-scalable=no">

<body>

<!-- ═══════════════════════════════════════════════════════════════
  All visual SVGs below are ORIGINAL generic geometric primitives
  drawn from scratch. They are wireframe samples, not derived from
  any third-party brand asset. Business team should replace with
  their own licensed media. See README.md placeholder table.
═══════════════════════════════════════════════════════════════ -->

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <linearGradient id="g-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A8FE7"/>
      <stop offset="100%" stop-color="#2F6FC8"/>
    </linearGradient>
    <linearGradient id="g-brand-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FB8E8"/>
      <stop offset="100%" stop-color="#6A98D4"/>
    </linearGradient>

    <!-- Self-designed brand logo (abstract, no real-brand reference). -->
    <!-- Mark: gradient circle + offset diamond ring + inner mono-letter "S" stylized as a wave -->
    <symbol id="logo-mark" viewBox="0 0 40 40">
      <!-- outer ring -->
      <circle cx="20" cy="20" r="18" fill="url(#g-brand)"/>
      <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
      <!-- inner diamond ring -->
      <path d="M20 7 L33 20 L20 33 L7 20 Z" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
      <!-- stylized monogram (abstract wave looking like "S") -->
      <path d="M14 15 Q14 12 18 12 L24 12 Q26 12 26 14 Q26 16 24 16 L18 16 Q14 16 14 19 Q14 22 16 22 L22 22 Q26 22 26 25 Q26 28 22 28 L16 28 Q14 28 14 26"
            fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Horizontal lockup: mark + small wordmark (abstract 3-letter pattern, no specific brand) -->
    <symbol id="logo-horizontal" viewBox="0 0 110 32">
      <!-- mark -->
      <circle cx="16" cy="16" r="14" fill="url(#g-brand)"/>
      <path d="M16 5 L27 16 L16 27 L5 16 Z" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
      <path d="M11 13 Q11 11 13 11 L19 11 Q21 11 21 12.5 Q21 14 19 14 L13 14 Q11 14 11 16 Q11 18 13 18 L17 18 Q21 18 21 20 Q21 22 17 22 L13 22"
            fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- wordmark text (drawn paths to avoid font dependency, stylized "BRAND") -->
      <g fill="#2D5B9C">
        <!-- B -->
        <path d="M37 9 L37 23 L43 23 Q47 23 47 20.5 Q47 18.5 45 18 Q47 17.5 47 15 Q47 12.5 43 12.5 L43 9 Z M40 12 L43 12 Q45 12 45 13.5 Q45 15 43 15 L40 15 Z M40 17 L43.5 17 Q45.5 17 45.5 19 Q45.5 21 43.5 21 L40 21 Z"/>
        <!-- R -->
        <path d="M50 9 L50 23 L52.5 23 L52.5 18 L54 18 L56 23 L58.8 23 L56.5 17.5 Q58 16.7 58 14.3 Q58 11 54.5 11 L50 11 Z M52.5 12.5 L54.5 12.5 Q55.6 12.5 55.6 14.3 Q55.6 16 54.5 16 L52.5 16 Z"/>
        <!-- A -->
        <path d="M61 23 L62 19 L65.6 19 L66.6 23 L69 23 L65 9 L62.6 9 L58.5 23 Z M62.5 17 L65.1 17 L63.8 12 Z"/>
        <!-- N -->
        <path d="M71 9 L71 23 L73.3 23 L73.3 13.5 L77.5 23 L79.8 23 L79.8 9 L77.5 9 L77.5 18.5 L73.3 9 Z"/>
        <!-- D -->
        <path d="M82 9 L82 23 L86.5 23 Q91 23 91 16 Q91 9 86.5 9 Z M84.5 12 L86 12 Q88.5 12 88.5 16 Q88.5 20 86 20 L84.5 20 Z"/>
      </g>
    </symbol>

    <!-- Generic playing card pair -->
    <symbol id="ph-cards" viewBox="0 0 64 64">
      <rect x="14" y="18" width="22" height="34" rx="3" fill="#FFFFFF" stroke="#7A92B5" stroke-width="1.5" transform="rotate(-12 25 35)"/>
      <rect x="28" y="14" width="22" height="34" rx="3" fill="#FFFFFF" stroke="#7A92B5" stroke-width="1.5" transform="rotate(8 39 31)"/>
      <circle cx="39" cy="31" r="3.5" fill="#7A92B5"/>
    </symbol>
    <!-- Generic person silhouette (kept for fallback) -->
    <symbol id="ph-person" viewBox="0 0 64 64">
      <circle cx="32" cy="22" r="11" fill="#8FA4BD"/>
      <path d="M12 60 Q12 38 32 38 Q52 38 52 60 Z" fill="#8FA4BD"/>
    </symbol>

    <!-- ── Self-drawn illustrations (monochromatic blue-grey palette, no real-person ref) ── -->
    <!-- Palette: deep #2D5B9C, mid #4A7FC9, soft #6FA0E0, light #92D0FF, pale #C8DCF4 -->

    <!-- Dealer figure: long hair, vest, hands forward dealing -->
    <symbol id="il-dealer" viewBox="0 0 120 150">
      <!-- back hair -->
      <path d="M30 38 Q30 18 60 18 Q90 18 90 38 L94 72 L86 64 L84 50 L36 50 L34 64 L26 72 Z" fill="#2D5B9C"/>
      <!-- face -->
      <ellipse cx="60" cy="42" rx="17" ry="21" fill="#C8DCF4"/>
      <!-- front hair fringe -->
      <path d="M44 30 Q52 20 60 20 Q68 20 76 30 L76 36 Q68 30 60 30 Q52 30 44 36 Z" fill="#2D5B9C"/>
      <!-- neck -->
      <rect x="54" y="58" width="12" height="10" fill="#C8DCF4"/>
      <!-- shoulders / vest jacket -->
      <path d="M28 92 Q28 70 60 68 Q92 70 92 92 L98 132 L22 132 Z" fill="#4A7FC9"/>
      <!-- inner shirt collar V -->
      <path d="M52 70 L60 88 L68 70 L64 70 L60 80 L56 70 Z" fill="#FAFCFF"/>
      <!-- vest darker accent stripe -->
      <path d="M28 92 Q28 70 60 68 Q92 70 92 92 L94 105 L86 100 L80 95 L72 90 L60 88 L48 90 L40 95 L34 100 L26 105 Z" fill="#2D5B9C" opacity="0.45"/>
      <!-- arms forward -->
      <ellipse cx="34" cy="107" rx="8" ry="20" fill="#4A7FC9" transform="rotate(-18 34 107)"/>
      <ellipse cx="86" cy="107" rx="8" ry="20" fill="#4A7FC9" transform="rotate(18 86 107)"/>
      <!-- hands -->
      <circle cx="36" cy="126" r="6" fill="#C8DCF4"/>
      <circle cx="84" cy="126" r="6" fill="#C8DCF4"/>
      <!-- card being dealt -->
      <rect x="48" y="114" width="24" height="18" fill="#FFFFFF" stroke="#2D5B9C" stroke-width="1.2" rx="2"/>
      <circle cx="60" cy="123" r="3" fill="#4A7FC9"/>
    </symbol>

    <!-- Athlete figure: kicking pose, plain blue kit -->
    <symbol id="il-athlete" viewBox="0 0 120 150">
      <!-- head -->
      <circle cx="62" cy="28" r="13" fill="#C8DCF4"/>
      <!-- short hair -->
      <path d="M50 22 Q50 14 62 14 Q74 14 74 22 L74 28 Q68 22 62 22 Q56 22 50 28 Z" fill="#2D5B9C"/>
      <!-- jersey -->
      <path d="M40 50 Q40 44 62 42 Q84 44 84 50 L90 96 L80 100 L80 60 L44 60 L44 100 L34 96 Z" fill="#4A7FC9"/>
      <!-- jersey collar V -->
      <path d="M56 42 L62 50 L68 42 Z" fill="#FAFCFF"/>
      <!-- jersey horizontal stripe accent -->
      <rect x="44" y="72" width="36" height="5" fill="#2D5B9C" opacity="0.55"/>
      <!-- shorts -->
      <path d="M44 96 L80 96 L82 120 L66 120 L62 105 L58 120 L42 120 Z" fill="#FAFCFF"/>
      <!-- legs -->
      <path d="M58 120 L52 144 L48 150 L44 150 L46 142 L52 120 Z" fill="#C8DCF4"/>
      <path d="M66 120 L82 126 L96 112 L93 108 L82 118 L66 112 Z" fill="#C8DCF4"/>
      <!-- arms -->
      <ellipse cx="30" cy="72" rx="6" ry="16" fill="#4A7FC9" transform="rotate(-25 30 72)"/>
      <ellipse cx="94" cy="80" rx="6" ry="14" fill="#4A7FC9" transform="rotate(35 94 80)"/>
      <!-- ball -->
      <circle cx="102" cy="108" r="10" fill="#FAFCFF" stroke="#2D5B9C" stroke-width="2"/>
      <path d="M97 104 L107 104 M102 98 L102 118 M95 110 L109 110" stroke="#2D5B9C" stroke-width="1.2"/>
    </symbol>

    <!-- Hero protagonist: suited figure with chip stack -->
    <symbol id="il-hero-protagonist" viewBox="0 0 120 150">
      <!-- head -->
      <circle cx="58" cy="30" r="13" fill="#C8DCF4"/>
      <!-- short hair -->
      <path d="M46 24 Q46 16 58 16 Q70 16 70 24 L70 30 Q64 24 58 24 Q52 24 46 30 Z" fill="#2D5B9C"/>
      <!-- suit jacket -->
      <path d="M34 52 Q34 46 58 44 Q82 46 82 52 L90 108 L82 112 L80 60 L40 60 L36 60 L34 112 L26 108 Z" fill="#2D5B9C"/>
      <!-- inner shirt -->
      <path d="M48 45 L58 80 L68 45 L64 50 L58 65 L52 50 Z" fill="#FAFCFF"/>
      <!-- tie -->
      <path d="M55 50 L61 50 L62 72 L58 82 L54 72 Z" fill="#4A7FC9"/>
      <!-- arms forward holding chips -->
      <ellipse cx="38" cy="80" rx="7" ry="18" fill="#2D5B9C" transform="rotate(-12 38 80)"/>
      <ellipse cx="78" cy="80" rx="7" ry="18" fill="#2D5B9C" transform="rotate(12 78 80)"/>
      <!-- hands -->
      <circle cx="34" cy="98" r="6" fill="#C8DCF4"/>
      <circle cx="82" cy="98" r="6" fill="#C8DCF4"/>
      <!-- chip stack -->
      <ellipse cx="58" cy="102" rx="22" ry="5" fill="#2D5B9C"/>
      <rect x="36" y="95" width="44" height="7" fill="#4A7FC9"/>
      <ellipse cx="58" cy="95" rx="22" ry="5" fill="#92D0FF"/>
      <ellipse cx="58" cy="88" rx="20" ry="4.5" fill="#2D5B9C"/>
      <rect x="38" y="82" width="40" height="6" fill="#4A7FC9"/>
      <ellipse cx="58" cy="82" rx="20" ry="4.5" fill="#92D0FF"/>
    </symbol>
    <!-- Generic chip stack -->
    <symbol id="ph-chips" viewBox="0 0 64 64">
      <ellipse cx="32" cy="48" rx="18" ry="5" fill="#7A92B5"/>
      <rect x="14" y="40" width="36" height="8" fill="#9AB0C8"/>
      <ellipse cx="32" cy="40" rx="18" ry="5" fill="#B8C9DE"/>
      <ellipse cx="32" cy="32" rx="16" ry="4.5" fill="#7A92B5"/>
      <rect x="16" y="24" width="32" height="8" fill="#9AB0C8"/>
      <ellipse cx="32" cy="24" rx="16" ry="4.5" fill="#B8C9DE"/>
    </symbol>
    <!-- Generic dice -->
    <symbol id="ph-dice" viewBox="0 0 64 64">
      <rect x="8" y="8" width="48" height="48" rx="8" fill="#FFFFFF" stroke="#7A92B5" stroke-width="2"/>
      <circle cx="20" cy="20" r="3" fill="#7A92B5"/>
      <circle cx="44" cy="20" r="3" fill="#7A92B5"/>
      <circle cx="32" cy="32" r="3" fill="#7A92B5"/>
      <circle cx="20" cy="44" r="3" fill="#7A92B5"/>
      <circle cx="44" cy="44" r="3" fill="#7A92B5"/>
    </symbol>
    <!-- Generic mahjong tile -->
    <symbol id="ph-mahjong" viewBox="0 0 64 64">
      <rect x="14" y="8" width="36" height="48" rx="4" fill="#FFFFFF" stroke="#7A92B5" stroke-width="2"/>
      <rect x="20" y="16" width="24" height="6" rx="1" fill="#9AB0C8"/>
      <rect x="20" y="28" width="24" height="6" rx="1" fill="#9AB0C8"/>
      <rect x="20" y="40" width="24" height="6" rx="1" fill="#9AB0C8"/>
    </symbol>
    <!-- Generic "more dots" -->
    <symbol id="ph-more" viewBox="0 0 64 64">
      <circle cx="18" cy="32" r="5" fill="#7A92B5"/>
      <circle cx="32" cy="32" r="5" fill="#7A92B5"/>
      <circle cx="46" cy="32" r="5" fill="#7A92B5"/>
    </symbol>

    <!-- Hero scene composition: silhouette + chips + cards on light backdrop  -->
    <symbol id="ph-hero-scene" viewBox="0 0 240 130">
      <!-- person silhouette left -->
      <g opacity="0.85">
        <circle cx="50" cy="48" r="16" fill="#6F8FB5"/>
        <path d="M22 124 Q22 76 50 76 Q78 76 78 124 Z" fill="#6F8FB5"/>
      </g>
      <!-- chip stack center -->
      <g opacity="0.85" transform="translate(110, 75)">
        <ellipse cx="0" cy="36" rx="22" ry="6" fill="#5F7BA4"/>
        <rect x="-22" y="26" width="44" height="10" fill="#7E98BD"/>
        <ellipse cx="0" cy="26" rx="22" ry="6" fill="#A4BCD8"/>
        <ellipse cx="0" cy="16" rx="20" ry="5.5" fill="#5F7BA4"/>
        <rect x="-20" y="6" width="40" height="10" fill="#7E98BD"/>
        <ellipse cx="0" cy="6" rx="20" ry="5.5" fill="#A4BCD8"/>
      </g>
      <!-- cards right -->
      <g opacity="0.92" transform="translate(180, 50)">
        <rect x="-2" y="0" width="28" height="42" rx="3" fill="#FFFFFF" stroke="#5F7BA4" stroke-width="1.5" transform="rotate(-15 12 21)"/>
        <rect x="12" y="-4" width="28" height="42" rx="3" fill="#FFFFFF" stroke="#5F7BA4" stroke-width="1.5" transform="rotate(12 26 17)"/>
        <circle cx="26" cy="17" r="4" fill="#5F7BA4"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="page">

  <header class="app-bar">
    <div class="app-bar-logo">
      <svg class="logo-mark-small" viewBox="0 0 32 32" aria-label="Sample brand mark"><use href="#logo-mark"/></svg>
      <div class="app-bar-text">
        <div class="app-bar-title">主品牌 App</div>
        <div class="app-bar-sub">体育投注，真人棋牌尽享一卡管理</div>
      </div>
    </div>
    <button class="app-bar-btn">立即下載</button>
  </header>

  <header class="top-bar">
    <svg class="logo-horizontal" viewBox="0 0 90 24" aria-label="Sample brand wordmark"><use href="#logo-horizontal"/></svg>
    <button class="top-bar-customer" aria-label="客服">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#5A7BA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
    </button>
  </header>

  <section class="hero">
    <svg class="hero-protagonist-svg" viewBox="0 0 120 150" preserveAspectRatio="xMidYMax meet" aria-label="Sample hero figure">
      <use href="#il-hero-protagonist"/>
    </svg>
    <div class="hero-cards-decor">
      <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ph-cards"/></svg>
    </div>
    <svg class="hero-decor-dice" viewBox="0 0 64 64" aria-hidden="true"><use href="#ph-dice"/></svg>
    <svg class="hero-decor-chips" viewBox="0 0 64 64" aria-hidden="true"><use href="#ph-chips"/></svg>
    <svg class="hero-decor-cup" viewBox="0 0 32 40" aria-hidden="true">
      <path d="M6 8 L26 8 L24 32 Q24 36 16 36 Q8 36 8 32 Z" fill="none" stroke="#5A7BA8" stroke-width="1.5"/>
      <ellipse cx="16" cy="9" rx="9" ry="2" fill="#5A7BA8" opacity="0.35"/>
      <path d="M11 16 L21 16 L20 24 L12 24 Z" fill="#92D0FF" opacity="0.6"/>
    </svg>
    <div class="hero-text">
      <div class="hero-title">精彩活動</div>
      <div class="hero-title-line2">即將登場</div>
      <div class="hero-subtitle">Sample · 業務端可替換</div>
    </div>
    <div class="hero-sponsors">
      <div class="sponsor-cell">
        <svg class="sponsor-mark" viewBox="0 0 32 32" aria-label="Sample partner A"><use href="#logo-mark"/></svg>
        <div class="sponsor-name">Partner A</div>
        <div class="sponsor-role">官方合作</div>
      </div>
      <div class="sponsor-divider"></div>
      <div class="sponsor-cell">
        <svg class="sponsor-mark" viewBox="0 0 32 32" aria-label="Sample partner B"><use href="#logo-mark"/></svg>
        <div class="sponsor-name">Partner B</div>
        <div class="sponsor-role">合作夥伴</div>
      </div>
    </div>
  </section>

  <div class="marquee">
    <img class="marquee-icon" src="assets/icons/home_loudspeaker.png" alt="">
    <div class="marquee-track">
      <span class="marquee-text">尊敬的用戶 · 系統公告即將更新 · 業務端可於後台自由替換通知內容</span>
    </div>
    <a class="marquee-more">全部
      <img src="assets/icons/home_top_arrow.png" alt="" class="arrow-icon">
    </a>
  </div>

  <div class="login-card">
    <div class="login-card-left">
      <div class="login-avatar-wrap">
        <svg viewBox="0 0 64 64" aria-label="Sample avatar"><use href="#ph-person"/></svg>
      </div>
      <div class="login-text">
        <div class="login-title">您还未登录</div>
        <div class="login-sub">登录/注册后查看更多</div>
      </div>
    </div>
    <button class="login-btn">点击登录</button>
  </div>

  <div class="hall-grid">
    <a class="hall-card hall-texas">
      <div class="hall-texas-bg"></div>
      <svg class="hall-texas-chips" viewBox="0 0 64 64" aria-label="Poker chips"><use href="#ph-chips"/></svg>
      <div class="hall-texas-title">德州撲克</div>
      <div class="hall-texas-sub">TEXAS HOLD'EM</div>
      <div class="hall-texas-tags">
        <span class="hall-texas-tag">錦標賽</span>
        <span class="hall-texas-tag">私人房</span>
      </div>
      <div class="hall-texas-others">
        <div class="hall-texas-others-title">其他玩法</div>
        <div class="hall-texas-others-grid">
          <div class="texas-sub">
            <div class="texas-sub-icon"><svg viewBox="0 0 64 64"><use href="#ph-cards"/></svg></div>
            <span>德州</span>
          </div>
          <div class="texas-sub">
            <div class="texas-sub-icon"><svg viewBox="0 0 64 64"><use href="#ph-mahjong"/></svg></div>
            <span>十三水</span>
          </div>
          <div class="texas-sub">
            <div class="texas-sub-icon"><svg viewBox="0 0 64 64"><use href="#ph-mahjong"/></svg></div>
            <span>紅中麻將</span>
          </div>
        </div>
      </div>
    </a>

    <a class="hall-card hall-real">
      <div class="hall-card-label">真人</div>
      <div class="hall-card-sub">异国美人美女荷官在线兑换互动体验</div>
      <div class="hall-portrait">
        <svg viewBox="0 0 120 150" preserveAspectRatio="xMidYMax meet" aria-label="Sample dealer illustration"><use href="#il-dealer"/></svg>
      </div>
    </a>

    <a class="hall-card hall-sport">
      <div class="hall-card-label">体育</div>
      <div class="hall-card-sub">业界最高赔率单场全球顶级赛事直播</div>
      <div class="hall-portrait">
        <svg viewBox="0 0 120 150" preserveAspectRatio="xMidYMax meet" aria-label="Sample athlete illustration"><use href="#il-athlete"/></svg>
      </div>
    </a>
  </div>

  <div class="other-section">
    <div class="other-grid">
      <a class="other-item"><img src="assets/more/home_more_game.png" alt=""><span>电竞</span></a>
      <a class="other-item"><img src="assets/more/home_more_lottery.png" alt=""><span>彩票</span></a>
      <a class="other-item"><img src="assets/more/home_more_chesscard.png" alt=""><span>棋牌</span></a>
      <a class="other-item"><img src="assets/more/home_more_electronic.png" alt=""><span>电子</span></a>
    </div>
  </div>

  <nav class="tab-bar">
    <a class="tab tab-active">
      <img src="assets/tabbar/main_tab_home_page_select.png" alt="">
      <span>首页</span>
    </a>
    <a class="tab">
      <img src="assets/tabbar/main_tab_activity.png" alt="">
      <span>活動</span>
    </a>
    <a class="tab">
      <img src="assets/tabbar/main_tab_customer.png" alt="">
      <span>客服</span>
    </a>
    <a class="tab">
      <img src="assets/tabbar/main_tab_mine.png" alt="">
      <span>我的</span>
    </a>
  </nav>

</div>
