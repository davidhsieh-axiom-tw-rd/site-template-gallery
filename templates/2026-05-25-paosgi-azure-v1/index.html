<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Paosgi Azure V1</title>
<link rel="stylesheet" href="style.css?v=20260525">
<!-- Flutter: origin is Nuxt 3 SPA (paosgi.com). No HTML→Flutter widget token mapping needed; see docs/flutter-token-mapping.md. line-height: 1.3 set in style.css. -->
<style>/* line-height: 1.3 (set via style.css) */</style>
<!-- All visual SVGs below are ORIGINAL generic geometric primitives drawn from scratch.
     They are wireframe samples, NOT derivatives of any third-party brand asset. -->

<body>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <linearGradient id="g-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FA0E8"/>
      <stop offset="100%" stop-color="#2D6FB0"/>
    </linearGradient>
    <linearGradient id="g-brand-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92C4F0"/>
      <stop offset="100%" stop-color="#6AAFE0"/>
    </linearGradient>
    <linearGradient id="g-hero" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D5B9C"/>
      <stop offset="100%" stop-color="#4A8FE7"/>
    </linearGradient>

    <!-- Mark: gradient circle + inner ring + monogram S wave (original geometric design) -->
    <symbol id="logo-mark" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="url(#g-brand)"/>
      <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
      <path d="M20 7 L33 20 L20 33 L7 20 Z" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
      <path d="M14 15 Q14 12 18 12 L24 12 Q26 12 26 14 Q26 16 24 16 L18 16 Q14 16 14 19 Q14 22 16 22 L22 22 Q26 22 26 25 Q26 28 22 28 L16 28 Q14 28 14 26"
            fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Horizontal logo lockup: mark + abstract "BRAND" wordmark -->
    <symbol id="logo-horizontal" viewBox="0 0 130 32">
      <circle cx="16" cy="16" r="14" fill="url(#g-brand)"/>
      <path d="M16 5 L27 16 L16 27 L5 16 Z" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
      <path d="M11 13 Q11 11 13 11 L19 11 Q21 11 21 12.5 Q21 14 19 14 L13 14 Q11 14 11 16 Q11 18 13 18 L17 18 Q21 18 21 20 Q21 22 17 22 L13 22"
            fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#2D5B9C">
        <path d="M37 9 L37 23 L43 23 Q47 23 47 20.5 Q47 18.5 45 18 Q47 17.5 47 15 Q47 12.5 43 12.5 L43 9 Z M40 12 L43 12 Q45 12 45 13.5 Q45 15 43 15 L40 15 Z M40 17 L43.5 17 Q45.5 17 45.5 19 Q45.5 21 43.5 21 L40 21 Z"/>
        <path d="M50 9 L50 23 L52.5 23 L52.5 18 L54 18 L56 23 L58.8 23 L56.5 17.5 Q58 16.7 58 14.3 Q58 11 54.5 11 L50 11 Z M52.5 12.5 L54.5 12.5 Q55.6 12.5 55.6 14.3 Q55.6 16 54.5 16 L52.5 16 Z"/>
        <path d="M61 23 L62 19 L65.6 19 L66.6 23 L69 23 L65 9 L62.6 9 L58.5 23 Z M62.5 17 L65.1 17 L63.8 12 Z"/>
        <path d="M71 9 L71 23 L73.3 23 L73.3 13.5 L77.5 23 L79.8 23 L79.8 9 L77.5 9 L77.5 18.5 L73.3 9 Z"/>
        <path d="M82 9 L82 23 L86.5 23 Q91 23 91 16 Q91 9 86.5 9 Z M84.5 12 L86 12 Q88.5 12 88.5 16 Q88.5 20 86 20 L84.5 20 Z"/>
      </g>
    </symbol>

    <!-- Generic game category icons (self-drawn primitives, no brand) -->
    <symbol id="ic-lottery" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="22" fill="#FFFFFF" stroke="#2D5B9C" stroke-width="2.5"/>
      <text x="32" y="38" font-family="Arial" font-size="16" font-weight="700" fill="#2D5B9C" text-anchor="middle">6</text>
      <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(45,91,156,0.3)" stroke-width="1" stroke-dasharray="3 2"/>
    </symbol>
    <symbol id="ic-live" viewBox="0 0 64 64">
      <circle cx="32" cy="24" r="10" fill="#4A8FE7"/>
      <path d="M14 56 Q14 38 32 38 Q50 38 50 56 Z" fill="#4A8FE7"/>
      <circle cx="32" cy="24" r="3" fill="rgba(255,255,255,0.5)"/>
    </symbol>
    <symbol id="ic-sport" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="20" fill="#FFFFFF" stroke="#2D5B9C" stroke-width="2.5"/>
      <path d="M32 12 L38 28 L52 30 L42 40 L46 56 L32 48 L18 56 L22 40 L12 30 L26 28 Z" fill="#4A8FE7"/>
    </symbol>
    <symbol id="ic-slots" viewBox="0 0 64 64">
      <rect x="10" y="14" width="44" height="36" rx="4" fill="#FFFFFF" stroke="#2D5B9C" stroke-width="2"/>
      <rect x="16" y="20" width="9" height="24" fill="#4A8FE7"/>
      <rect x="27.5" y="20" width="9" height="24" fill="#4A8FE7"/>
      <rect x="39" y="20" width="9" height="24" fill="#4A8FE7"/>
      <circle cx="20.5" cy="32" r="2.5" fill="#FFFFFF"/>
      <circle cx="32" cy="32" r="2.5" fill="#FFFFFF"/>
      <circle cx="43.5" cy="32" r="2.5" fill="#FFFFFF"/>
    </symbol>
    <symbol id="ic-cards" viewBox="0 0 64 64">
      <rect x="14" y="18" width="22" height="34" rx="3" fill="#FFFFFF" stroke="#2D5B9C" stroke-width="2" transform="rotate(-12 25 35)"/>
      <rect x="28" y="14" width="22" height="34" rx="3" fill="#FFFFFF" stroke="#2D5B9C" stroke-width="2" transform="rotate(8 39 31)"/>
      <path d="M37 27 L40 24 L43 27 L40 32 Z" fill="#4A8FE7"/>
    </symbol>
    <symbol id="ic-fishing" viewBox="0 0 64 64">
      <path d="M14 32 Q14 20 26 18 L46 26 Q54 30 54 36 Q54 42 46 46 L26 50 Q14 48 14 36 Z" fill="#4A8FE7"/>
      <circle cx="22" cy="32" r="3" fill="#FFFFFF"/>
      <path d="M46 26 L58 22 L54 32 L58 42 L46 38" fill="#2D5B9C"/>
      <path d="M14 32 L6 28 M14 36 L6 40" stroke="#2D5B9C" stroke-width="2"/>
    </symbol>

    <!-- Self-drawn dealer figure (monochromatic blue palette) -->
    <symbol id="il-dealer" viewBox="0 0 120 150">
      <path d="M30 38 Q30 18 60 18 Q90 18 90 38 L94 72 L86 64 L84 50 L36 50 L34 64 L26 72 Z" fill="#2D5B9C"/>
      <ellipse cx="60" cy="42" rx="17" ry="21" fill="#C8DCF4"/>
      <path d="M44 30 Q52 20 60 20 Q68 20 76 30 L76 36 Q68 30 60 30 Q52 30 44 36 Z" fill="#2D5B9C"/>
      <rect x="54" y="58" width="12" height="10" fill="#C8DCF4"/>
      <path d="M28 92 Q28 70 60 68 Q92 70 92 92 L98 132 L22 132 Z" fill="#4A8FE7"/>
      <path d="M52 70 L60 88 L68 70 L64 70 L60 80 L56 70 Z" fill="#FAFCFF"/>
      <ellipse cx="34" cy="107" rx="8" ry="20" fill="#4A8FE7" transform="rotate(-18 34 107)"/>
      <ellipse cx="86" cy="107" rx="8" ry="20" fill="#4A8FE7" transform="rotate(18 86 107)"/>
      <circle cx="36" cy="126" r="6" fill="#C8DCF4"/>
      <circle cx="84" cy="126" r="6" fill="#C8DCF4"/>
      <rect x="48" y="114" width="24" height="18" fill="#FFFFFF" stroke="#2D5B9C" stroke-width="1.2" rx="2"/>
      <circle cx="60" cy="123" r="3" fill="#4A8FE7"/>
    </symbol>

    <symbol id="il-athlete" viewBox="0 0 120 150">
      <circle cx="62" cy="28" r="13" fill="#C8DCF4"/>
      <path d="M50 22 Q50 14 62 14 Q74 14 74 22 L74 28 Q68 22 62 22 Q56 22 50 28 Z" fill="#2D5B9C"/>
      <path d="M40 50 Q40 44 62 42 Q84 44 84 50 L90 96 L80 100 L80 60 L44 60 L44 100 L34 96 Z" fill="#4A8FE7"/>
      <path d="M56 42 L62 50 L68 42 Z" fill="#FAFCFF"/>
      <rect x="44" y="72" width="36" height="5" fill="#2D5B9C" opacity="0.55"/>
      <path d="M44 96 L80 96 L82 120 L66 120 L62 105 L58 120 L42 120 Z" fill="#FAFCFF"/>
      <path d="M58 120 L52 144 L48 150 L44 150 L46 142 L52 120 Z" fill="#C8DCF4"/>
      <path d="M66 120 L82 126 L96 112 L93 108 L82 118 L66 112 Z" fill="#C8DCF4"/>
      <ellipse cx="30" cy="72" rx="6" ry="16" fill="#4A8FE7" transform="rotate(-25 30 72)"/>
      <ellipse cx="94" cy="80" rx="6" ry="14" fill="#4A8FE7" transform="rotate(35 94 80)"/>
      <circle cx="102" cy="108" r="10" fill="#FAFCFF" stroke="#2D5B9C" stroke-width="2"/>
      <path d="M97 104 L107 104 M102 98 L102 118 M95 110 L109 110" stroke="#2D5B9C" stroke-width="1.2"/>
    </symbol>

    <!-- Hero scene: abstract chip + token + dice (no specific brand assets) -->
    <symbol id="ph-hero-objects" viewBox="0 0 240 130">
      <g opacity="0.85" transform="translate(40, 30)">
        <circle r="32" cx="32" cy="40" fill="url(#g-brand)" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
        <text x="32" y="50" font-family="Arial" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">$</text>
      </g>
      <g opacity="0.85" transform="translate(140, 55)">
        <ellipse cx="0" cy="30" rx="22" ry="6" fill="#2D5B9C"/>
        <rect x="-22" y="20" width="44" height="10" fill="#4A8FE7"/>
        <ellipse cx="0" cy="20" rx="22" ry="6" fill="#92C4F0"/>
        <ellipse cx="0" cy="10" rx="20" ry="5.5" fill="#2D5B9C"/>
        <rect x="-20" y="0" width="40" height="10" fill="#4A8FE7"/>
        <ellipse cx="0" cy="0" rx="20" ry="5.5" fill="#92C4F0"/>
      </g>
    </symbol>

    <!-- Search icon -->
    <symbol id="ic-search" viewBox="0 0 24 24">
      <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="15" y1="15" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <!-- Customer service icon -->
    <symbol id="ic-cs" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="#4A8FE7"/>
      <text x="12" y="16" font-family="Arial" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">24H</text>
    </symbol>
  </defs>
</svg>

<div class="page">

  <!-- Top bar: brand + tag-line + register / login -->
  <header class="top-bar">
    <div class="top-brand">
      <svg class="logo-horizontal-svg" viewBox="0 0 130 32" aria-label="Sample brand"><use href="#logo-horizontal"/></svg>
      <div class="tagline">Sample Tagline · 業務端可替換</div>
    </div>
    <div class="top-actions">
      <button class="btn-outline">登入</button>
      <button class="btn-primary">註冊</button>
    </div>
  </header>

  <!-- Tab bar: horizontal scroll game categories -->
  <nav class="tab-nav">
    <a class="tab-nav-item active">首頁</a>
    <a class="tab-nav-item">彩票</a>
    <a class="tab-nav-item">視訊</a>
    <a class="tab-nav-item">電子</a>
    <a class="tab-nav-item">體育</a>
    <a class="tab-nav-item">棋牌</a>
    <a class="tab-nav-item">捕魚</a>
  </nav>

  <!-- Hero banner -->
  <section class="hero">
    <svg class="hero-objects" viewBox="0 0 240 130" preserveAspectRatio="xMidYMid slice" aria-label="Sample hero objects"><use href="#ph-hero-objects"/></svg>
    <div class="hero-text">
      <div class="hero-title">主視覺標題</div>
      <div class="hero-subtitle">Sample · Hero Banner</div>
      <button class="hero-cta">立即體驗</button>
    </div>
  </section>

  <!-- 6 categories grid (3x2) -->
  <section class="cat-section">
    <div class="cat-section-title">
      <span class="cat-title-text">遊戲大廳</span>
      <span class="cat-title-sub">精選熱品 · 業務端配置</span>
    </div>
    <div class="cat-grid">
      <a class="cat-card cat-lottery">
        <div class="cat-card-icon"><svg viewBox="0 0 64 64"><use href="#ic-lottery"/></svg></div>
        <div class="cat-card-text">
          <div class="cat-card-name">彩票</div>
          <div class="cat-card-sub">LOTTERY</div>
        </div>
      </a>
      <a class="cat-card cat-live">
        <div class="cat-card-icon"><svg viewBox="0 0 64 64"><use href="#ic-live"/></svg></div>
        <div class="cat-card-text">
          <div class="cat-card-name">真人</div>
          <div class="cat-card-sub">LIVE</div>
        </div>
      </a>
      <a class="cat-card cat-sport">
        <div class="cat-card-icon"><svg viewBox="0 0 64 64"><use href="#ic-sport"/></svg></div>
        <div class="cat-card-text">
          <div class="cat-card-name">體育</div>
          <div class="cat-card-sub">SPORTS</div>
        </div>
      </a>
      <a class="cat-card cat-slots">
        <div class="cat-card-icon"><svg viewBox="0 0 64 64"><use href="#ic-slots"/></svg></div>
        <div class="cat-card-text">
          <div class="cat-card-name">電子</div>
          <div class="cat-card-sub">SLOTS</div>
        </div>
      </a>
      <a class="cat-card cat-poker">
        <div class="cat-card-icon"><svg viewBox="0 0 64 64"><use href="#ic-cards"/></svg></div>
        <div class="cat-card-text">
          <div class="cat-card-name">棋牌</div>
          <div class="cat-card-sub">POKER</div>
        </div>
      </a>
      <a class="cat-card cat-fishing">
        <div class="cat-card-icon"><svg viewBox="0 0 64 64"><use href="#ic-fishing"/></svg></div>
        <div class="cat-card-text">
          <div class="cat-card-name">捕魚</div>
          <div class="cat-card-sub">FISHING</div>
        </div>
      </a>
    </div>
  </section>

  <!-- Hot games carousel (3 illustrative sample cards) -->
  <section class="hot-section">
    <div class="hot-title">熱門遊戲<span class="hot-title-sub">SAMPLE · 業務端配置</span></div>
    <div class="hot-tabs">
      <a class="hot-tab active">真人遊戲</a>
      <a class="hot-tab">彩票遊戲</a>
      <a class="hot-tab">電子遊戲</a>
      <a class="hot-tab">體育賽事</a>
    </div>
    <div class="hot-cards">
      <a class="hot-card">
        <div class="hot-card-img"><svg viewBox="0 0 120 150" preserveAspectRatio="xMidYMax meet" aria-label="Sample dealer"><use href="#il-dealer"/></svg></div>
        <div class="hot-card-label">SW01 · 桌面</div>
      </a>
      <a class="hot-card">
        <div class="hot-card-img"><svg viewBox="0 0 120 150" preserveAspectRatio="xMidYMax meet" aria-label="Sample dealer"><use href="#il-dealer"/></svg></div>
        <div class="hot-card-label">SW02 · 桌面</div>
      </a>
      <a class="hot-card">
        <div class="hot-card-img"><svg viewBox="0 0 120 150" preserveAspectRatio="xMidYMax meet" aria-label="Sample dealer"><use href="#il-dealer"/></svg></div>
        <div class="hot-card-label">SW03 · 桌面</div>
      </a>
    </div>
    <div class="hot-dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
  </section>

  <!-- App download -->
  <section class="app-section">
    <div class="app-text">
      <div class="app-title">精彩遊戲 · 隨時隨地</div>
      <div class="app-sub">公平公正 · Sample 文案</div>
    </div>
    <div class="app-buttons">
      <button class="app-btn app-ios">
        <span class="app-btn-icon">⌘</span>
        <div class="app-btn-text">下載<br><b>iPhone</b></div>
      </button>
      <button class="app-btn app-android">
        <span class="app-btn-icon">▷</span>
        <div class="app-btn-text">下載<br><b>Android</b></div>
      </button>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-title">關於我們</div>
    <div class="footer-links">
      <a>關於</a><span>·</span><a>合作</a><span>·</span><a>客服</a><span>·</span><a>條款</a>
    </div>
    <div class="footer-copy">© 2026 Sample Brand · 業務端版權資訊</div>
  </footer>

</div>
</body>
</html>
